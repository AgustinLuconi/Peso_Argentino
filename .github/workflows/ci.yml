name: CI - Integración Continua & Validación de Tipos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: TypeCheck & Build de Producción
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔍 Compilación TypeScript & Bundle Vite
        run: npm run build

      - name: ✅ Reportar estado exitoso
        run: echo "🎉 Build completado con 0 errores TypeScript y bundle de producción generado exitosamente." >> $GITHUB_STEP_SUMMARY
